server {
    listen 80;
    server_name _;

    # DNS embebido de Docker: re-resuelve `backend` periódicamente para repartir
    # entre todas las réplicas (p. ej. `--scale backend=2`), en round-robin.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 6m;
    client_body_timeout 30s;
    proxy_read_timeout 120s;

    # --- API REST ---
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se sobrescribe XFF: el backend solo confía en X-Real-IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSockets ---
    location /ws/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Frontend Vite (con HMR) ---
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
