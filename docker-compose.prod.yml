# =============================================================================
# Pyckle - entorno de PRODUCCION
#   docker compose -f docker-compose.prod.yml up -d --build
# Requiere .env con STORAGE_BACKEND=s3, SECRET_KEY y dominio real.
# Postgres y Redis NO publican puertos: solo red interna.
# =============================================================================
name: pyckle

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - internal

  backend:
    image: pyckle-backend:prod
    build:
      context: ./backend
      target: prod
    restart: always
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,127.0.0.1/32,::1/128}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    # Las migraciones se ejecutan una sola vez antes de escalar (ver README);
    # no en el arranque de cada réplica para evitar DDL concurrente.
    command:
      - sh
      - -c
      - "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000${API_V1_PREFIX:-/api/v1}/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal
      - edge

  frontend:
    image: pyckle-frontend:prod
    build:
      context: ./frontend
      target: prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - edge

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - edge

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  internal:
    internal: true
  edge:
